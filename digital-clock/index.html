<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A beautiful digital clock showing the current time across multiple time zones.">
  <title>World Clock | Time Zones</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div class="brand"><span class="brand-mark">◷</span><span>WORLD CLOCK</span></div>
      <div class="controls"><button class="icon-button" id="formatToggle" type="button">24H</button><button class="icon-button" id="themeToggle" type="button">☼</button></div>
    </header>
    <section class="hero"><p class="eyebrow">YOUR LOCAL TIME</p><div class="hero-time" id="localTime">00:00:00</div><div class="hero-meta"><span id="localDate">Loading date...</span><span class="dot">•</span><span id="localZone">Local time</span></div></section>
    <section class="clock-section"><div class="section-heading"><div><p class="eyebrow">GLOBAL OVERVIEW</p><h1>Time around the world</h1></div><button class="add-button" id="addZone" type="button">＋ Add timezone</button></div><div class="clock-grid" id="clockGrid"></div></section>
    <footer><span>Updated every second</span><span id="lastUpdated">—</span></footer>
  </main>
  <dialog id="zoneDialog"><form method="dialog" class="dialog-card"><button class="close-button" value="cancel" aria-label="Close">×</button><p class="eyebrow">ADD A LOCATION</p><h2>Choose a timezone</h2><div class="zone-options" id="zoneOptions"></div></form></dialog>
  <script src="script.js"></script>
</body>
</html>
